[project]
name = "autonomous-claude"
version = "0.1.0"
description = "PTY wrapper around `claude` exposing a Unix-socket control channel for self-compact/clear/exit."
requires-python = ">=3.11"
dependencies = ["ptyprocess>=0.7"]

[project.scripts]
autonomous-claude = "autonomous_claude:main"
autonomous-claude-ctl = "autonomous_claude_ctl:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["autonomous_claude.py", "autonomous_claude_ctl.py"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["autonomous_claude.py", "autonomous_claude_ctl.py"]

[[tool.mypy.overrides]]
module = "ptyprocess"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
